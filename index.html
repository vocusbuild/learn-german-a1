<body>
<title>Wortliste A1 Trainer</title>

<style>
/* Layout: one narrow column, like a phone app. German always appears on a yellow
   town-entry sign (Ortstafel); English on a white supplementary plate (Zusatzzeichen). */
:root {
  --bg: #eff1f4;
  --surface: #ffffff;
  --surface-2: #e6e9ee;
  --ink: #14171c;
  --muted: #59606c;
  --line: #d5d9e0;
  --sign: #f2c500;
  --sign-ink: #121212;
  --plate: #ffffff;
  --btn: #14171c;
  --btn-ink: #ffffff;
  --der: #1f56c4;
  --die: #c42a3a;
  --das: #12804a;
  --ok: #157a42;
  --ok-bg: #e2f3e8;
  --bad: #b8460b;
  --bad-bg: #fbe9de;
  --focus: #1f56c4;
  --der-sign: #1240a6;
  --die-sign: #a60f25;
  --das-sign: #0a6234;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --surface-2: #222630; --ink: #eceef2; --muted: #9ba2ae; --line: #2b303a;
    --plate: #f4f5f7; --btn: #f2c500; --btn-ink: #121212;
    --der: #7aa2ff; --die: #ff7482; --das: #4fcf8a; --ok: #46d184; --ok-bg: #12301f; --bad: #ff9a5c; --bad-bg: #3a2014; --focus: #7aa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --surface-2: #222630; --ink: #eceef2; --muted: #9ba2ae; --line: #2b303a;
  --plate: #f4f5f7; --btn: #f2c500; --btn-ink: #121212;
  --der: #7aa2ff; --die: #ff7482; --das: #4fcf8a; --ok: #46d184; --ok-bg: #12301f; --bad: #ff9a5c; --bad-bg: #3a2014; --focus: #7aa2ff;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: .01em; }
.brand span { font-size: 13px; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--ok); }

/* ---------- the sign ---------- */
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 14px; padding: 9px; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08); }
.sign-in { border: 3.5px solid var(--sign-ink); border-radius: 8px; padding: 14px 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 120px; justify-content: center; }
.sign .art { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1; letter-spacing: .04em; }
.sign .art.der { color: var(--der-sign); } .sign .art.die { color: var(--die-sign); } .sign .art.das { color: var(--das-sign); }
.sign .art.q { color: var(--sign-ink); opacity: .55; }
.sign .word { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 10vw, 54px); line-height: 1.02; overflow-wrap: anywhere; }
.sign .sub { font-size: 14px; font-weight: 600; letter-spacing: .02em; margin-top: 6px; }
.sign.small .sign-in { min-height: 0; padding: 10px 14px 9px; }
.sign.small .word { font-size: clamp(28px, 8vw, 40px); }
.plate { background: var(--plate); color: #121212; border: 3px solid #121212; border-radius: 8px; padding: 12px 16px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.06); }
.plate .pl-k { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #5a5f69; }
.plate .pl-w { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 7vw, 36px); line-height: 1.1; }
.plate.small .pl-w { font-size: 22px; }

/* ---------- home ---------- */
.today { display: flex; flex-direction: column; gap: 14px; }
.today .sign-in { min-height: 0; }
.today .sign .word { font-size: clamp(44px, 14vw, 68px); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.2; }
@media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .35s ease; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: var(--r); border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 17px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }
.sched { font-size: 14px; color: var(--muted); text-align: center; }
.sched b { color: var(--ink); }

.section { display: flex; flex-direction: column; gap: 10px; }
.section h2 { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.ladder div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; line-height: 1.2; min-width: 0; }
.ladder b { display: block; font-family: var(--f-display); font-size: 17px; }
@media (max-width: 420px) { .ladder { grid-template-columns: repeat(3, 1fr); } }

.grid30 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tile { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px; min-width: 0; }
.tile b { font-family: var(--f-display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 10px; color: var(--muted); line-height: 1.1; text-align: center; overflow: hidden; max-width: 100%; }
.tile.done { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tile.done span { color: var(--bg); opacity: .75; }
.tile.cur { background: var(--sign); border-color: var(--sign-ink); color: var(--sign-ink); border-width: 2.5px; }
.tile.cur span { color: var(--sign-ink); opacity: .8; }
.tile.rev { border-style: dashed; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1.5px solid var(--line); }
.legend i.d { background: var(--ink); border-color: var(--ink); } .legend i.c { background: var(--sign); border-color: #121212; } .legend i.r { border-style: dashed; }

.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .cards2 { grid-template-columns: 1fr; } }
.mini { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.mini b { font-weight: 700; font-size: 16px; }
.mini span { font-size: 14px; color: var(--muted); }
.mini:disabled { opacity: .5; cursor: default; }

details.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.settings summary { padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
details.settings summary::after { content: "+"; font-weight: 700; }
details.settings[open] summary::after { content: "–"; }
.set-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.field p { font-size: 13px; color: var(--muted); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 6px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.confirm { background: var(--bad-bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- session ---------- */
.sesbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.sesbar .bar { flex: 1; }
.sesbar .cnt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.task { font-size: 15px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.new { background: var(--sign); color: #121212; }
.stage { display: flex; gap: 4px; }
.stage i { width: 18px; height: 5px; border-radius: 3px; background: var(--surface-2); }
.stage i.on { background: var(--ink); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 56px; width: 100%; text-align: left; padding: 10px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 500; }
.opt kbd { font-family: var(--f-body); font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.opt .a-der { color: var(--der); font-weight: 700; } .opt .a-die { color: var(--die); font-weight: 700; } .opt .a-das { color: var(--das); font-weight: 700; }
.gender { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gender button { min-height: 72px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 30px; font-weight: 700; }
.gender .g-der { color: var(--der); } .gender .g-die { color: var(--die); } .gender .g-das { color: var(--das); }
.gender button.right { border-color: var(--ok); background: var(--ok-bg); } .gender button.wrong { border-color: var(--bad); background: var(--bad-bg); }

.play { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.play svg { width: 16px; height: 16px; }
.bigplay { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--sign); color: #121212; display: flex; align-items: center; justify-content: center; margin: 4px auto; box-shadow: inset 0 0 0 5px var(--sign), inset 0 0 0 8.5px #121212; }
.bigplay svg { width: 44px; height: 44px; }
.center { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }

.typebox { display: flex; flex-direction: column; gap: 10px; }
input, textarea, select { box-sizing: border-box; max-width: 100%; }
.typebox input { font: inherit; font-size: 22px; font-weight: 600; padding: 14px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.typebox input.okc { border-color: var(--ok); } .typebox input.badc { border-color: var(--bad); }
.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.keys button { min-width: 46px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 600; }
.keys .hint { margin-left: auto; font-size: 14px; padding: 0 12px; }

.mic { width: 120px; height: 120px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-ink); display: flex; align-items: center; justify-content: center; margin: 6px auto 0; }
.mic svg { width: 46px; height: 46px; }
.mic.live { background: var(--die); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,42,58,.45); } 50% { box-shadow: 0 0 0 16px rgba(196,42,58,0); } }
@media (prefers-reduced-motion: reduce) { .mic.live { animation: none; } .bar > i { transition: none; } }
.score { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.score .num { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .meter { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.score .meter i { display: block; height: 100%; border-radius: 99px; }
.heard { font-size: 15px; }
.heard q { font-weight: 700; quotes: "„" "“"; }

.fb { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid; }
.fb.ok { background: var(--ok-bg); border-color: var(--ok); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb-h { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1; }
.fb.ok .fb-h { color: var(--ok); } .fb.bad .fb-h { color: var(--bad); }
.fb-a { font-size: 18px; font-weight: 600; }
.fb-a .a-der { color: var(--der); } .fb-a .a-die { color: var(--die); } .fb-a .a-das { color: var(--das); }
.fb-m { font-size: 15px; }
.ex { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.ex .play { padding: 6px 10px; flex: none; }
.ex p { min-width: 0; padding-top: 3px; }
.facts { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.facts .kv { display: flex; gap: 10px; font-size: 15px; }
.facts .kv span:first-child { color: var(--muted); min-width: 64px; }

.sum { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .w { flex: 1; min-width: 0; }
.li .w b { font-weight: 600; } .li .w small { display: block; color: var(--muted); font-size: 13px; }
.li .a-der { color: var(--der); font-weight: 700; } .li .a-die { color: var(--die); font-weight: 700; } .li .a-das { color: var(--das); font-weight: 700; }
.dots { display: flex; gap: 3px; flex: none; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-2); }
.dots i.on { background: var(--ok); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn svg { width: 16px; height: 16px; }
.ex p em, .exline em { display: block; font-style: normal; color: var(--muted); font-size: 14px; }
.exline { display: block; text-align: left; border: 0; background: transparent; padding: 4px 0 0; font-size: 14px; width: 100%; }
.exline span { color: var(--ink); }
.tips { display: flex; flex-direction: column; gap: 4px; }
.tips ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.scorerow { display: flex; align-items: baseline; gap: 12px; }
.verdict { font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.diff { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 18px; font-weight: 600; }
.diff .dl { display: inline-block; min-width: 92px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.diff mark { border-radius: 3px; padding: 0 1px; color: var(--surface); }
.diff mark.you { background: var(--bad); text-decoration: line-through; }
.diff mark.fix { background: var(--ok); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
</style>

<main id="app" aria-live="polite"></main>

/* Mark which letters differ between what was typed and the right spelling. */

  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1));

  return `<div class="score"><div class="label">Pronunciation</div><div class="scorerow"><span class="num">${sp.score}</span><span class="verdict">${verdict}</span></div><div class="meter"><i style="width:${sp.score}%;background:${col}"></i></div>
    ${sp.heard ? `<div class="heard">You said: <q lang="de">${esc(sp.heard)}</q></div>` : ''}
    ${tipsHTML(sp.remarks, sp.score >= 85 ? '' : 'Fix this')}
    <div class="heard">Target: <b lang="de">${deHTML(w)}</b></div></div>
    ${s.answered ? '' : `<div class="row">${playBtn(w, 'w', 'Native speaker')}<button class="btn ghost" data-act="mic">Try again</button><button class="btn" data-act="speakdone">${sp.score >= 60 ? 'Weiter' : 'Continue'}</button></div>`}`;
}

function vSummary() {
  const s = SES, st = s.st, acc = st.a ? Math.round(st.c / st.a * 100) : 0;
  const mins = Math.max(1, Math.round(st.ms / 60000));
  const setAdv = S.set > s.startSet;
  const left = S.set <= SETS ? setWords(S.set).filter(w => !isLearned(w)).length : 0;
  return `
  <div class="sign"><div class="sign-in"><div class="art q">${s.kind === 'daily' || s.kind === 'next' ? 'Session' : 'Practice'}</div><div class="word">${acc >= 85 ? 'Sehr gut!' : acc >= 65 ? 'Gut gemacht' : 'Weiter so'}</div><div class="sub tnum">${st.a} answers · ${mins} min</div></div></div>
  <div class="sum">
    <div class="stat"><b>${acc}%</b><span>correct</span></div>
    <div class="stat"><b>${st.n}</b><span>new words learned</span></div>
    <div class="stat"><b>${st.r}</b><span>reviews</span></div>
    <div class="stat"><b>${st.sn ? Math.round(st.sp / st.sn) : '–'}</b><span>speaking score</span></div>
  </div>
  ${setAdv ? `<p class="sched">Set ${s.startSet} is complete. ${S.set <= SETS ? `Set ${S.set} (${esc(setTopic(S.set).en)}) is next.` : 'That was the last set.'}</p>` : left ? `<p class="sched">${left} word${left > 1 ? 's' : ''} left in set ${S.set}. They'll be first next session.</p>` : ''}
  <div class="row">
    ${S.set <= SETS ? `<button class="btn" data-act="next">${setAdv ? `Start set ${S.set} now` : 'Keep learning'}</button>` : ''}
    <button class="btn ghost" data-act="home">Back to plan</button>
  </div>`;
}

/* ================= actions ================= */
function answerMC(i) {
  const s = SES; if (s.answered) return;
  const o = s.card.opts[i]; s.picked = i; s.answered = true;
  const w = s.card.w;
  let msg = '';
  if (!o.ok) {
    if (o.fakeArt) msg = `Right word, wrong article. It's <b class="a-${parse(w).art}" style="color:var(--${parse(w).art})">${parse(w).art}</b>.`;
    else if (o.w) msg = s.card.mode === 'mcEN' ? `<span lang="de">${deHTML(o.w)}</span> means “${esc(o.w.en)}”.` : `That's <span lang="de">${deHTML(o.w)}</span>.`;
  }
  s.feedback = { ok: o.ok, msg };
  record(o.ok);
  if (o.ok && s.card.mode !== 'listen') playWord(w);
  render();
  if (o.ok) autoNext(900);
}
let autoT = null;
function autoNext(ms) { clearTimeout(autoT); autoT = setTimeout(() => { if (SES && SES.answered && VIEW === 'session') nextCard(); }, ms); }
function answerArt(a) {
  const s = SES; if (s.answered) return;
  const w = s.card.w, p = parse(w); s.answered = true; s.pickedArt = a;
  const ok = a === p.art;
  s.feedback = { ok, msg: ok ? '' : `It's <b style="color:var(--${p.art})">${p.art}</b> ${esc(p.body)}.` };
  record(ok); playWord(w); render();
  if (ok) autoNext(900);
}
function answerTyped() {
  const s = SES; if (s.answered) return;
  const inp = document.getElementById('ans'); s.typed = inp ? inp.value : '';
  const w = s.card.w, p = parse(w), g = gradeTyped(w, s.typed);
  if (g.kind === 'empty') { toast('Type your answer first'); return; }
  let ok = g.ok, head = '';
  if (ok && s.hintN >= 2) ok = false;
  let artNote = '';
  if (g.kind === 'spell' && g.art) artNote = !g.saidArt ? ` Also add the article: <b style="color:var(--${g.art})">${g.art}</b>.` : g.saidArt !== g.art ? ` The article is wrong too: it's <b style="color:var(--${g.art})">${g.art}</b>.` : ' The article is right.';
  const capNote = (g.kind === 'exact' && p.kind === 'noun' && /^(der|die|das\s+)?[a-zäöü]/.test(s.typed.trim().replace(/^(der|die|das)\s+/i, ''))) ? `Tip: German nouns start with a capital letter: <b lang="de">${esc(p.body)}</b>.` : '';
  if (g.kind === 'spell') head = 'Misspelled';
  if (g.kind === 'typo' && ok) head = 'Richtig · small typo';
  const msgs = {
    exact: s.hintN ? 'Correct, with a hint.' : capNote,
    typo: `Accepted, but it's slightly misspelled.${diffHTML(g)}`,
    spell: `Close, but the spelling is wrong.${artNote}${diffHTML(g)}`,
    syn: g.other ? `<span lang="de">${esc(g.other.de)}</span> is also right. This card's word is:` : '',
    article: `Right word, wrong article: it's <b style="color:var(--${p.art})">${p.art}</b>, not ${esc(g.said || '')}.`,
    noart: `Add the article. Nouns are learned with der, die or das.`,
    wrong: s.card.mode === 'dictation' ? 'Listen again and compare the spelling.' : ''
  };
  let msg = msgs[g.kind] || '';
  if (g.ok && !ok) msg = 'You needed most of the word as a hint, so this one comes back.';
  s.answered = true; s.feedback = { ok, msg, head };
  record(ok); playWord(w); render();
}
async function doMic(auto) {
  const s = SES; if (!s || s.answered || (s.speech && s.speech.state === 'live')) return;
  const card = s.card;
  s.speech = { state: 'live' }; render();
  try {
    const alts = await listen();
    if (!SES || SES !== s || s.card !== card) return;
    micWorked = true;
    const r = alts.length ? speechScore(card.w, alts) : { s: 0, t: '', art: true };
    s.speech = { state: 'done', score: r.s, heard: r.t, art: r.art, remarks: remarks(card.w, r) };
    const m = mut(card.w.id); m[5] = r.s; touch();
    render();
    if (r.s < 85) setTimeout(() => { if (SES === s && s.card === card) playWord(card.w); }, 400);
  } catch (err) {
    if (!SES || SES !== s || s.card !== card) return;
    if (auto) { autoMicOff = true; s.speech = null; render(); return; }
    speechBroken = true; speechWhy = String(err);
    card.mode = 'say'; s.speech = null;
    toast('The microphone did not start. Practise by listening and repeating.');
    render();
  }
}
function tipsHTML(list, label) {
  if (!list || !list.length) return '';
  return `<div class="tips">${label ? `<div class="label">${label}</div>` : ''}<ul>${list.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
}
function xferCopy() {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const ta = document.getElementById('xfer');
  const done = () => toast('Progress code copied. Paste it into the other version.');
  const fallback = () => { if (ta) { ta.value = code; ta.focus(); ta.select(); } toast('Code is in the box. Copy it from there.'); };
  try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
}
function xferImport() {
  const ta = document.getElementById('xfer'); const raw = (ta && ta.value || '').trim();
  if (!raw) { toast('Paste a progress code into the box first'); return; }
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(raw.replace(/\s+/g, '')))));
    if (!adopt(o)) throw new Error('bad');
    S.upd = Date.now(); touch(); flush(); render(); toast('Progress loaded');
  } catch (e) { toast('That code could not be read. Copy it again, all of it.'); }
}
function speakDone() {
  const s = SES; if (!s || s.answered || !s.speech) return;
  const sc = s.speech.score, ok = sc >= 60;
  s.st.sp += sc; s.st.sn++; const d = dayRec(); d.sp += sc; d.sn++;
  s.answered = true; s.feedback = { ok, msg: ok ? '' : 'Listen to it, then you will meet this word again soon.' };
  record(ok); if (!ok) playWord(s.card.w); render();
}
function hint() {
  const s = SES, p = parse(s.card.w), inp = document.getElementById('ans');
  const target = p.variants[0];
  s.hintN = (s.hintN || 0) + 1;
  const n = Math.min(target.length, (p.art ? p.art.length + 1 : 0) + s.hintN * 2);
  if (inp) { inp.value = target.slice(0, n); inp.focus(); }
}

app.addEventListener('click', e => {
  unlockAudio();
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM' || b.tagName === 'SELECT' || b.tagName === 'TEXTAREA') return;
  const act = b.dataset.act;
  switch (act) {
    case 'daily': startSession(VIEW === 'summary' ? 'next' : 'daily'); break;
    case 'next': startSession('next'); break;
    case 'practice': startSession('practice'); break;
    case 'weak': startSession('weak'); break;
    case 'home': SES = null; VIEW = 'home'; render(); break;
    case 'browse': BROWSE = +b.dataset.n; VIEW = 'browse'; render(); break;
    case 'quit': clearTimeout(autoT); quit(); break;
    case 'introok': { const m = mut(SES.card.w.id); m[0] = 1; SES.last.push(SES.card.w.id); touch(); nextCard(); break; }
    case 'pick': answerMC(+b.dataset.i); break;
    case 'art': answerArt(b.dataset.v); break;
    case 'cont': clearTimeout(autoT); nextCard(); break;
    case 'pw': playWord(BYID.get(+b.dataset.id)); break;
    case 'pex': playEx(BYID.get(+b.dataset.id)); break;
    case 'xcopy': xferCopy(); break;
    case 'ximport': xferImport(); break;
    case 'key': { const inp = document.getElementById('ans'); if (inp) { const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? st; inp.value = inp.value.slice(0, st) + b.dataset.k + inp.value.slice(en); inp.focus(); inp.setSelectionRange(st + 1, st + 1); } break; }
    case 'hint': hint(); break;
    case 'mic': doMic(false); break;
    case 'micstop': if (REC) try { REC.stop(); } catch (er) { /* */ } break;
    case 'skipmic': SES.card.mode = 'say'; SES.speech = null; render(); break;
    case 'speakdone': speakDone(); break;
    case 'reveal': SES.revealed = true; playWord(SES.card.w); render(); break;
    case 'self': { const ok = b.dataset.v === '1'; SES.answered = true; SES.feedback = { ok, msg: '' }; record(ok); render(); break; }
    case 'opt-speak': S.opt.speak = b.dataset.v; touch(); render(); document.getElementById('settings').open = true; break;
    case 'opt-audio': S.opt.audio = b.dataset.v === '1'; touch(); render(); document.getElementById('settings').open = true; break;
    case 'mictest': micTest(b); break;
    case 'reset': CONFIRM_RESET = true; render(); document.getElementById('settings').open = true; break;
    case 'reset-no': CONFIRM_RESET = false; render(); document.getElementById('settings').open = true; break;
    case 'reset-yes': { const opt = S.opt; S = fresh(); S.opt = opt; CONFIRM_RESET = false; touch(); render(); toast('Progress erased'); break; }
  }
});
app.addEventListener('submit', e => { e.preventDefault(); if (SES && !SES.answered) answerTyped(); else if (SES && SES.answered) nextCard(); });
app.addEventListener('input', e => { if (e.target.id === 'ans' && SES) SES.typed = e.target.value; });
async function micTest(b) {
  b.disabled = true; b.textContent = 'Say „Hallo“ now…';
  try {
    const alts = await listen();
    speechBroken = false; speechWhy = ''; micWorked = true; autoMicOff = false;
    toast(alts.length ? `Heard: „${alts[0].t}“. The microphone works.` : 'Nothing heard. Check your microphone and try again.');
  } catch (err) { speechBroken = true; speechWhy = String(err); toast('The microphone is blocked here. Speaking will use "say it aloud".'); }
  render(); const d = document.getElementById('settings'); if (d) d.open = true;
}
document.addEventListener('keydown', e => {
  if (VIEW !== 'session' || !SES || !SES.card) return;
  const inInput = e.target && e.target.id === 'ans';
  const m = SES.card.mode;
  if (!SES.answered && (m === 'mcDE' || m === 'mcEN' || m === 'listen') && /^[1-4]$/.test(e.key) && !inInput) { answerMC(+e.key - 1); e.preventDefault(); return; }
  if (!SES.answered && m === 'gender' && /^[1-3]$/.test(e.key)) { answerArt(ARTS[+e.key - 1]); e.preventDefault(); return; }
  if (e.key === 'Enter' && !inInput) {
    const c = document.getElementById('cont');
    if (c) { c.click(); e.preventDefault(); }
  }
});

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
if (location.hash === '#selftest') window.__wl = { remarks, speechScore, parse, WORDS, wordTips, gradeTyped, diffHTML };
render();
initCloud();
})();
</script>
